name: Backfill Historical Data (manual)

# Manual-only - this deliberately has no `schedule:` trigger. Run it once
# from the Actions tab to seed data.json with matches from the last
# 14 days; re-running later is safe (existing entries are skipped).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run historical backfill
        env:
          RTT_API_TOKEN: ${{ secrets.RTT_API_TOKEN }}
        run: python backfill_history.py

      - name: Commit backfilled history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Backfill historical sightings"
            git push
          fi
